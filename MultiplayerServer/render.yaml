services:
  - type: web
    name: pixelfront-multiplayer
    env: node
    rootDir: MultiplayerServer
    buildCommand: "npm install"
    startCommand: "npm start"
    plan: starter
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGIN
        sync: false
      - key: MAX_PLAYERS_PER_LOBBY
        value: 8
      - key: LOBBY_IDLE_TTL_MS
        value: 21600000
      - key: MATCH_SNAPSHOT_INTERVAL_MS
        value: 60
      - key: MATCH_SNAPSHOT_FORCE_INTERVAL_MS
        value: 240
      - key: MATCH_STATE_HASH_EVERY_TICKS
        value: 24
      - key: MATCH_SNAPSHOT_STATS_INTERVAL_MS
        value: 220
      - key: MATCH_SNAPSHOT_RELATIONS_INTERVAL_MS
        value: 320
      - key: MATCH_SNAPSHOT_EVENTS_INTERVAL_MS
        value: 550
      - key: MATCH_LAG_WARN_INTERVAL_MS
        value: 5000
      - key: MATCH_MAX_STEPS_PER_PUMP
        value: 8
      - key: MATCH_PUMP_INTERVAL_MS
        value: 16
      - key: MATCH_MAX_BACKLOG_MS
        value: 250
      - key: MATCH_MAX_WORLD_WIDTH
        value: 960
      - key: MATCH_MAX_WORLD_HEIGHT
        value: 540
      - key: MATCH_MAX_WORLD_TILES
        value: 220000
      - key: MATCH_MAX_AI_COUNT
        value: 6
      - key: WS_DEBUG_LOGS
        value: 0
