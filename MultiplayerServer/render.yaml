services:
  - type: web
    name: pixelfront-multiplayer
    env: node
    rootDir: MultiplayerServer
    buildCommand: "npm install"
    startCommand: "npm start"
    plan: starter
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CORS_ORIGIN
        sync: false
      - key: MAX_PLAYERS_PER_LOBBY
        value: 8
